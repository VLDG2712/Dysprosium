syntax = "proto3";

package dys.v1;

// Served on the main mTLS listener. Every call requires an allowlisted client cert.
service System {
  rpc Ping(PingRequest) returns (PingReply);

  // NVIDIA power limit. Reads need no privileges; changes go through the polkit-gated
  // dysd-gpu-limit@<W>.service unit. A set value is saved and reapplied when dysd starts.
  rpc GetGpu(GetGpuRequest) returns (GpuInfo);
  rpc SetGpuPowerLimit(SetGpuPowerLimitRequest) returns (GpuInfo);

  // Sets UEFI BootNext to Windows Boot Manager and reboots (dysd-reboot-windows.service).
  rpc RebootToWindows(RebootToWindowsRequest) returns (RebootToWindowsReply);

  // Pending repo (checkupdates) + AUR (yay -Qua) updates. Read-only, cached for 10 min.
  rpc CheckUpdates(CheckUpdatesRequest) returns (UpdateList);
  // Starts dysd-update.service (pacman -Syu, repo packages only). LAN or local socket only.
  rpc ApplyUpdates(ApplyUpdatesRequest) returns (UpdateStatus);
  rpc GetUpdateStatus(GetUpdateStatusRequest) returns (UpdateStatus);
}

message PingRequest {}

message PingReply {
  string hostname = 1;
  string daemon_version = 2;
  // SHA-256 of the client cert as seen by dysd (lowercase hex). Handy for debugging pairing.
  string client_fingerprint = 3;
  // dysd sees this connection as coming from the LAN (not Tailscale/public). Authoritative for
  // LAN-only actions like ApplyUpdates; the phone can't reliably tell from the host name.
  bool from_lan = 4;
}

message GetGpuRequest {}

message GpuInfo {
  string name = 1;
  string driver_version = 2;
  // All in whole watts.
  uint32 limit_w = 3;
  uint32 min_w = 4;
  uint32 default_w = 5;
  uint32 max_w = 6;
  uint32 draw_w = 7;
  // Value dysd reapplies at startup; 0 = none saved (driver default after boot).
  uint32 saved_w = 8;
}

message SetGpuPowerLimitRequest {
  // Must be within [min_w, max_w]. 0 = back to the driver default and forget the saved value.
  uint32 watts = 1;
}

message RebootToWindowsRequest {
  // Must be true; guards against accidental calls.
  bool confirm = 1;
}

message RebootToWindowsReply {}

message CheckUpdatesRequest {
  // Ignore the cache and check now.
  bool force = 1;
}

message PackageUpdate {
  enum Source {
    REPO = 0;
    AUR = 1;
  }
  string name = 1;
  string old_version = 2;
  string new_version = 3;
  Source source = 4;
}

message UpdateList {
  repeated PackageUpdate updates = 1;
  uint64 checked_unix = 2;
  // Non-empty if that half of the check failed (the other half may still be valid).
  string repo_error = 3;
  string aur_error = 4;
}

message ApplyUpdatesRequest {
  bool confirm = 1;
}

message GetUpdateStatusRequest {
  // How many lines of the pacman log to return (0 = default 20, max 200).
  uint32 log_lines = 1;
}

message UpdateStatus {
  enum State {
    NEVER = 0;
    RUNNING = 1;
    SUCCEEDED = 2;
    FAILED = 3;
  }
  State state = 1;
  // systemd's result ("success", "exit-code", "timeout", ...) of the last run.
  string result = 2;
  int32 exit_status = 3;
  uint64 finished_unix = 4;
  repeated string log_tail = 5;
  // The last run upgraded the kernel, NVIDIA driver or systemd.
  bool reboot_recommended = 6;
}

// Served ONLY on the short-lived pairing listener (server-auth TLS, no client cert), which exists
// only while a pairing session started via Admin.StartPairing is active.
//
// The phone has no CA yet, so it must NOT do normal chain validation here. Instead it pins the
// server's leaf certificate: SHA-256 of the leaf DER must equal the `sfp` value from the QR code.
// Without that pin the token could be phished by anyone on the network.
service Pairing {
  rpc Pair(PairRequest) returns (PairReply);
}

message PairRequest {
  // One-time secret from the QR code (`token`).
  string token = 1;
  // Shown in `dys clients list`. Letters, digits, space and -_.() only, max 64 chars.
  string device_name = 2;
  // PKCS#10 CSR (DER) generated on the phone; the private key never leaves the phone.
  // Only its public key is used; requested subject/SANs/extensions are ignored.
  bytes csr_der = 3;
}

message PairReply {
  bytes client_cert_der = 1;
  // Trust anchor for the main listener from now on.
  bytes ca_cert_der = 2;
}

// Local-only admin API: served on the Unix socket (/run/dysd/dysd.sock), never on TCP.
service Admin {
  // Opens the pairing listener and streams progress until paired, expired or cancelled.
  // Dropping the stream (Ctrl+C in `dys pair`) cancels the session.
  rpc StartPairing(StartPairingRequest) returns (stream PairingEvent);
  rpc ListClients(ListClientsRequest) returns (ListClientsReply);
  rpc RevokeClient(RevokeClientRequest) returns (RevokeClientReply);
}

message StartPairingRequest {
  // 0 = default (120 s). Capped at 600 s.
  uint32 timeout_secs = 1;
}

message PairingEvent {
  oneof event {
    PairingStarted started = 1;
    PairingCompleted completed = 2;
    PairingEnded ended = 3;
  }
}

message PairingStarted {
  // dys://pair?v=1&name=<host>&host=<h1>&host=<h2>&port=<pairing>&main=<main>&token=<hex>&sfp=<hex>
  string uri = 1;
  uint64 expires_unix = 2;
}

message PairingCompleted {
  string device_name = 1;
  string fingerprint = 2;
}

message PairingEnded {
  // "expired", "cancelled", "too many failed attempts"
  string reason = 1;
}

message ClientInfo {
  string fingerprint = 1;
  string name = 2;
  uint64 added_unix = 3;
}

message ListClientsRequest {}

message ListClientsReply {
  repeated ClientInfo clients = 1;
}

message RevokeClientRequest {
  // Full fingerprint or a unique prefix of at least 8 hex chars.
  string fingerprint_prefix = 1;
}

message RevokeClientReply {
  ClientInfo revoked = 1;
}
