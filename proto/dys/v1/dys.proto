syntax = "proto3";

package dys.v1;

// Served on the main mTLS listener. Every call requires an allowlisted client cert.
service System {
  rpc Ping(PingRequest) returns (PingReply);

  // NVIDIA power limit. Reads need no privileges; changes go through the polkit-gated
  // dysd-gpu-limit@<W>.service unit. A set value is saved and reapplied when dysd starts.
  rpc GetGpu(GetGpuRequest) returns (GpuInfo);
  rpc SetGpuPowerLimit(SetGpuPowerLimitRequest) returns (GpuInfo);

  // Sets UEFI BootNext to Windows Boot Manager and reboots (dysd-reboot-windows.service).
  rpc RebootToWindows(RebootToWindowsRequest) returns (RebootToWindowsReply);

  // Pending repo (checkupdates) + AUR (yay -Qua) updates. Read-only, cached for 10 min.
  rpc CheckUpdates(CheckUpdatesRequest) returns (UpdateList);
  // Starts dysd-update.service (pacman -Syu, repo packages only). LAN or local socket only.
  rpc ApplyUpdates(ApplyUpdatesRequest) returns (UpdateStatus);
  rpc GetUpdateStatus(GetUpdateStatusRequest) returns (UpdateStatus);

  // RGB lighting, through the local OpenRGB SDK server (127.0.0.1:6742, protocol 6).
  // Device ids are OpenRGB's own unique ids: list first, don't hard-code them.
  rpc ListRgbDevices(ListRgbDevicesRequest) returns (RgbDeviceList);
  // One solid colour on the whole device, or off.
  rpc SetRgbColor(SetRgbColorRequest) returns (RgbDevice);
  // Switch to a mode (effect) and change its speed/brightness/direction/colours.
  rpc SetRgbMode(SetRgbModeRequest) returns (RgbDevice);
  // Software effect computed by dysd and pushed to the LEDs ~20x/s (for devices whose own effect
  // modes don't work). Any SetRgbColor/SetRgbMode on the device stops it; effect "none" stops it
  // and leaves the last frame. Colour, mode and effect changes are saved per device by dysd and
  // reapplied after boot, a dysd restart or an OpenRGB restart ("none" forgets the device).
  rpc SetRgbEffect(SetRgbEffectRequest) returns (RgbDevice);

  // Live system stats. Read-only, no privileges. WatchStats sends one sample per second while the
  // stream is open (all watchers share one sampler); GetStats returns one sample.
  rpc GetStats(GetStatsRequest) returns (Stats);
  rpc WatchStats(WatchStatsRequest) returns (stream Stats);

  // Pump/fan through nzxt-ctl's socket. Reading needs nothing; SetFanMode needs nzxt-ctl with the
  // SetMode request and `[cooling] allow_mode_changes = true` in /etc/dysd/dysd.toml.
  rpc GetCooling(GetCoolingRequest) returns (Cooling);
  rpc SetFanMode(SetFanModeRequest) returns (Cooling);

  // Profiles: named snapshots of GPU limit + fan mode + lighting, applied in one call.
  rpc ListProfiles(ListProfilesRequest) returns (ProfileList);
  // Captures the current state of the selected parts under `name` (replaces a profile of that name).
  rpc SaveProfile(SaveProfileRequest) returns (ProfileList);
  rpc DeleteProfile(DeleteProfileRequest) returns (ProfileList);
  rpc ApplyProfile(ApplyProfileRequest) returns (ApplyProfileReply);

  // Minecraft server ([minecraft] in /etc/dysd/dysd.toml): systemd state + players over RCON.
  rpc GetMinecraft(GetMinecraftRequest) returns (MinecraftStatus);
  rpc MinecraftAction(MinecraftActionRequest) returns (MinecraftStatus);

  // ntfy alerts ([alerts] in /etc/dysd/dysd.toml).
  rpc GetAlerts(GetAlertsRequest) returns (AlertStatus);
  rpc SendTestAlert(SendTestAlertRequest) returns (AlertStatus);

  // Reboot, shut down or suspend through logind (polkit: 50-dysd.rules allows these login1
  // actions for user dysd, never the -ignore-inhibit variants). dysd checks with logind first
  // (CanReboot/CanPowerOff/CanSuspend), answers, then acts after `delay_ms` so the reply gets out.
  rpc Power(PowerRequest) returns (PowerReply);

  // Static facts about the PC (OS, kernel, shell, desktop, CPU, GPU, RAM, disks, network) as
  // titled sections of label/value pairs, so the phone can show new items without an update.
  // Cached for 60 s unless `refresh`.
  rpc GetInfo(GetInfoRequest) returns (SystemInfo);
}

message PingRequest {}

message PingReply {
  string hostname = 1;
  string daemon_version = 2;
  // SHA-256 of the client cert as seen by dysd (lowercase hex). Handy for debugging pairing.
  string client_fingerprint = 3;
  // dysd sees this connection as coming from the LAN (not Tailscale/public). Authoritative for
  // LAN-only actions like ApplyUpdates; the phone can't reliably tell from the host name.
  bool from_lan = 4;
}

message GetGpuRequest {}

message GpuInfo {
  string name = 1;
  string driver_version = 2;
  // All in whole watts.
  uint32 limit_w = 3;
  uint32 min_w = 4;
  uint32 default_w = 5;
  uint32 max_w = 6;
  uint32 draw_w = 7;
  // Value dysd reapplies at startup; 0 = none saved (driver default after boot).
  uint32 saved_w = 8;
}

message SetGpuPowerLimitRequest {
  // Must be within [min_w, max_w]. 0 = back to the driver default and forget the saved value.
  uint32 watts = 1;
}

message RebootToWindowsRequest {
  // Must be true; guards against accidental calls.
  bool confirm = 1;
}

message RebootToWindowsReply {}

message CheckUpdatesRequest {
  // Ignore the cache and check now.
  bool force = 1;
}

message PackageUpdate {
  enum Source {
    REPO = 0;
    AUR = 1;
  }
  string name = 1;
  string old_version = 2;
  string new_version = 3;
  Source source = 4;
}

message UpdateList {
  repeated PackageUpdate updates = 1;
  uint64 checked_unix = 2;
  // Non-empty if that half of the check failed (the other half may still be valid).
  string repo_error = 3;
  string aur_error = 4;
}

message ApplyUpdatesRequest {
  bool confirm = 1;
}

message GetUpdateStatusRequest {
  // How many lines of the pacman log to return (0 = default 20, max 200).
  uint32 log_lines = 1;
}

message UpdateStatus {
  enum State {
    NEVER = 0;
    RUNNING = 1;
    SUCCEEDED = 2;
    FAILED = 3;
  }
  State state = 1;
  // systemd's result ("success", "exit-code", "timeout", ...) of the last run.
  string result = 2;
  int32 exit_status = 3;
  uint64 finished_unix = 4;
  repeated string log_tail = 5;
  // The last run upgraded the kernel, NVIDIA driver or systemd.
  bool reboot_recommended = 6;
}

message ListRgbDevicesRequest {}

message RgbDeviceList {
  repeated RgbDevice devices = 1;
  // Names accepted by SetRgbEffect.
  repeated string software_effects = 2;
}

message RgbDevice {
  uint32 id = 1;
  string name = 2;
  string vendor = 3;
  string location = 4;
  // OpenRGB DEVICE_TYPE_* (0 motherboard, 1 DRAM, 2 GPU, 3 cooler, 4 LED strip, 5 keyboard, ...).
  int32 kind = 5;
  uint32 led_count = 6;
  // Index into `modes`.
  int32 active_mode = 7;
  repeated RgbMode modes = 8;
  // Last known colour of every LED, 0xRRGGBB.
  repeated uint32 led_colors = 9;
  // Software effect currently running on this device ("" = none).
  string software_effect = 10;
}

message RgbMode {
  string name = 1;
  // OpenRGB MODE_FLAG_* bits: 0 speed, 1 left/right, 2 up/down, 3 horizontal/vertical direction,
  // 4 brightness, 5 per-LED colours, 6 mode colours, 7 random colour.
  uint32 flags = 2;
  uint32 speed_min = 3;
  uint32 speed_max = 4;
  uint32 speed = 5;
  uint32 brightness_min = 6;
  uint32 brightness_max = 7;
  uint32 brightness = 8;
  uint32 colors_min = 9;
  uint32 colors_max = 10;
  // 0 left, 1 right, 2 up, 3 down, 4 horizontal, 5 vertical.
  uint32 direction = 11;
  // The mode's own colours (0xRRGGBB); only meaningful if flag 6 is set.
  repeated uint32 colors = 12;
}

message SetRgbColorRequest {
  uint32 device_id = 1;
  // 0xRRGGBB. Ignored when `off` is set.
  uint32 rgb = 2;
  bool off = 3;
}

message SetRgbEffectRequest {
  uint32 device_id = 1;
  // One of RgbDeviceList.software_effects, or "none".
  string effect = 2;
  // 1 (slow) .. 10 (fast); 0 = default (5).
  uint32 speed = 3;
  // 1..100 %; 0 = 100.
  uint32 brightness = 4;
  // 0xRRGGBB for breathing/wave (default white); rainbow ignores it.
  optional uint32 rgb = 5;
}

message RgbColors {
  repeated uint32 rgb = 1;
}

message SetRgbModeRequest {
  uint32 device_id = 1;
  // Index into RgbDevice.modes.
  uint32 mode_index = 2;
  // Unset = keep the mode's current value. Setting something the mode doesn't have is an error.
  optional uint32 speed = 3;
  optional uint32 brightness = 4;
  optional uint32 direction = 5;
  optional RgbColors colors = 6;
}

// ---- stats -------------------------------------------------------------------------------------

message GetStatsRequest {}

message WatchStatsRequest {}

message Stats {
  uint64 unix_ms = 1;
  string hostname = 2;
  double uptime_s = 3;
  repeated double load_avg = 4; // 1, 5, 15 min
  CpuStats cpu = 5;
  MemStats mem = 6;
  repeated MountStats mounts = 7;
  repeated DiskStats disks = 8;
  repeated NetStats nets = 9;
  GpuStats gpu = 10; // unset if nvidia-smi failed
  Cooling cooling = 11;
  repeated ProcStats top_cpu = 12;
  repeated ProcStats top_mem = 13;
  repeated SensorStats sensors = 14;
}

message CpuStats {
  string model = 1;
  float usage_pct = 2;
  repeated float core_pct = 3; // per logical CPU
  float freq_mhz_avg = 4;
  float freq_mhz_max = 5;
  optional float temp_c = 6; // package temperature
}

message MemStats {
  // bytes
  uint64 total = 1;
  uint64 used = 2; // total - available
  uint64 available = 3;
  uint64 swap_total = 4;
  uint64 swap_used = 5;
}

// A mounted filesystem dysd can see (its sandbox hides /home: a separate /home partition is not
// listed, but its disk still appears under `disks`).
message MountStats {
  string mount = 1;
  string device = 2;
  string fs = 3;
  uint64 total = 4; // bytes
  uint64 used = 5;
}

// A physical disk (nvme0n1, sda, ...).
message DiskStats {
  string name = 1;
  double read_bps = 2; // bytes per second
  double write_bps = 3;
  optional float temp_c = 4;
  uint64 size = 5; // bytes
}

message NetStats {
  string name = 1;
  bool up = 2;
  double rx_bps = 3; // bytes per second
  double tx_bps = 4;
  uint64 rx_total = 5;
  uint64 tx_total = 6;
  int32 link_mbps = 7; // -1 = unknown (Wi-Fi, tun)
}

message GpuStats {
  string name = 1;
  float util_pct = 2;
  uint64 mem_used = 3; // bytes
  uint64 mem_total = 4;
  float temp_c = 5;
  float power_w = 6;
  float power_limit_w = 7;
  float clock_mhz = 8;
  optional float fan_pct = 9;
}

message ProcStats {
  uint32 pid = 1;
  string name = 2;
  float cpu_pct = 3; // share of the whole CPU (all cores = 100)
  uint64 rss = 4; // bytes
}

message SensorStats {
  string chip = 1; // hwmon name: coretemp, nvme, ...
  string label = 2;
  float temp_c = 3;
}

// ---- cooling (nzxt-ctl) -------------------------------------------------------------------------

message GetCoolingRequest {}

message SetFanModeRequest {
  // "performance", "silent" or "auto"
  string mode = 1;
}

message Cooling {
  // nzxt-ctl answered. If false, `error` says why and the rest is empty.
  bool available = 1;
  string error = 2;
  optional float liquid_c = 3;
  optional float cpu_c = 4;
  optional float gpu_c = 5;
  optional uint32 pump_rpm = 6;
  optional uint32 fan_rpm = 7;
  optional uint32 pump_duty_pct = 8;
  optional uint32 fan_duty_pct = 9;
  string mode = 10; // "performance" / "silent" / "auto" ("" if unknown)
  bool failsafe_active = 11;
  // `[cooling] allow_mode_changes` in dysd.toml.
  bool mode_changes_allowed = 12;
  repeated string modes = 13;
}

// ---- profiles -----------------------------------------------------------------------------------

message ListProfilesRequest {}

message Profile {
  string name = 1;
  optional uint32 gpu_watts = 2; // 0 = driver default
  optional string fan_mode = 3;
  uint32 rgb_devices = 4; // lighting saved for this many devices (0 = lighting not part of it)
  uint64 saved_unix = 5;
}

message ProfileList {
  repeated Profile profiles = 1;
}

message SaveProfileRequest {
  string name = 1; // 1..32 chars: letters, digits, space, -_.
  bool include_gpu = 2;
  bool include_fan = 3;
  bool include_rgb = 4;
}

message DeleteProfileRequest {
  string name = 1;
}

message ApplyProfileRequest {
  string name = 1;
}

message ApplyProfileReply {
  message Part {
    string part = 1; // "gpu", "fan", "rgb"
    bool ok = 2;
    string message = 3;
  }
  repeated Part parts = 1;
}

// ---- minecraft ----------------------------------------------------------------------------------

message GetMinecraftRequest {}

message MinecraftActionRequest {
  enum Action {
    START = 0;
    STOP = 1;
    RESTART = 2;
  }
  Action action = 1;
  bool confirm = 2; // required for STOP and RESTART
  // STOP/RESTART: announce in chat and wait this long first (0..300 s). The call returns at once.
  uint32 warn_seconds = 3;
}

message MinecraftStatus {
  bool configured = 1;
  string unit = 2;
  string active_state = 3; // systemd: active, inactive, failed, activating, deactivating
  string sub_state = 4;
  uint64 since_unix = 5; // when it entered the current state (0 = unknown)
  uint64 memory_bytes = 6;
  bool rcon_ok = 7;
  string rcon_error = 8;
  uint32 players_online = 9;
  uint32 players_max = 10;
  repeated string players = 11;
  optional float tps = 12; // NeoForge `neoforge tps`, if it answers
  string pending = 13; // e.g. "restart in 30 s" while a warned stop/restart is pending
}

// ---- alerts -------------------------------------------------------------------------------------

message GetAlertsRequest {}

message SendTestAlertRequest {}

message AlertStatus {
  bool configured = 1;
  string server = 2; // ntfy URL (no token)
  string topic = 3;
  float cpu_temp_c = 4;
  float gpu_temp_c = 5;
  float liquid_temp_c = 6;
  bool updates_finished = 7;
  bool minecraft_crashed = 8;
  uint32 cooldown_min = 9;
  // Most recent alerts sent since dysd started, newest first (max 10).
  repeated SentAlert recent = 10;
}

message SentAlert {
  uint64 unix = 1;
  string title = 2;
  string message = 3;
  bool ok = 4;
  string error = 5;
}

message PowerRequest {
  enum Action {
    ACTION_UNSPECIFIED = 0; // rejected
    REBOOT = 1;
    SHUTDOWN = 2;
    SLEEP = 3; // suspend to RAM
  }
  Action action = 1;
  bool confirm = 2; // must be true
}

message PowerReply {
  // dysd starts the action this long after replying.
  uint32 delay_ms = 1;
}

message GetInfoRequest {
  bool refresh = 1;
}

message SystemInfo {
  repeated InfoSection sections = 1;
  uint64 collected_unix = 2;
}

message InfoSection {
  string title = 1;
  // Icon hint for the phone: system, cpu, gpu, memory, storage, network.
  string icon = 2;
  repeated InfoItem items = 3;
}

message InfoItem {
  string label = 1;
  string value = 2;
}

// Served ONLY on the short-lived pairing listener (server-auth TLS, no client cert), which exists
// only while a pairing session started via Admin.StartPairing is active.
//
// The phone has no CA yet, so it must NOT do normal chain validation here. Instead it pins the
// server's leaf certificate: SHA-256 of the leaf DER must equal the `sfp` value from the QR code.
// Without that pin the token could be phished by anyone on the network.
service Pairing {
  rpc Pair(PairRequest) returns (PairReply);
}

message PairRequest {
  // One-time secret from the QR code (`token`).
  string token = 1;
  // Shown in `dys clients list`. Letters, digits, space and -_.() only, max 64 chars.
  string device_name = 2;
  // PKCS#10 CSR (DER) generated on the phone; the private key never leaves the phone.
  // Only its public key is used; requested subject/SANs/extensions are ignored.
  bytes csr_der = 3;
}

message PairReply {
  bytes client_cert_der = 1;
  // Trust anchor for the main listener from now on.
  bytes ca_cert_der = 2;
}

// Local-only admin API: served on the Unix socket (/run/dysd/dysd.sock), never on TCP.
service Admin {
  // Opens the pairing listener and streams progress until paired, expired or cancelled.
  // Dropping the stream (Ctrl+C in `dys pair`) cancels the session.
  rpc StartPairing(StartPairingRequest) returns (stream PairingEvent);
  rpc ListClients(ListClientsRequest) returns (ListClientsReply);
  rpc RevokeClient(RevokeClientRequest) returns (RevokeClientReply);
}

message StartPairingRequest {
  // 0 = default (120 s). Capped at 600 s.
  uint32 timeout_secs = 1;
}

message PairingEvent {
  oneof event {
    PairingStarted started = 1;
    PairingCompleted completed = 2;
    PairingEnded ended = 3;
  }
}

message PairingStarted {
  // dys://pair?v=1&name=<host>&host=<h1>&host=<h2>&port=<pairing>&main=<main>&token=<hex>&sfp=<hex>
  string uri = 1;
  uint64 expires_unix = 2;
}

message PairingCompleted {
  string device_name = 1;
  string fingerprint = 2;
}

message PairingEnded {
  // "expired", "cancelled", "too many failed attempts"
  string reason = 1;
}

message ClientInfo {
  string fingerprint = 1;
  string name = 2;
  uint64 added_unix = 3;
}

message ListClientsRequest {}

message ListClientsReply {
  repeated ClientInfo clients = 1;
}

message RevokeClientRequest {
  // Full fingerprint or a unique prefix of at least 8 hex chars.
  string fingerprint_prefix = 1;
}

message RevokeClientReply {
  ClientInfo revoked = 1;
}
