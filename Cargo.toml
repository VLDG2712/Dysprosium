[workspace]
resolver = "3"
members = ["crates/dys-core", "crates/dys-tls", "crates/dys-openrgb", "crates/dysd", "crates/dys"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dys-core = { path = "crates/dys-core" }
dys-tls = { path = "crates/dys-tls" }
dys-openrgb = { path = "crates/dys-openrgb" }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "fs"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
time = "0.3.55"
